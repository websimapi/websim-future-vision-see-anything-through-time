<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Vision - See Anything Through Time</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .section h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #4ecdc4;
        }

        .generate-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .prompt-input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1rem;
            backdrop-filter: blur(10px);
        }

        .prompt-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .generate-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 3px solid transparent;
        }

        .gallery-item:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .gallery-item.selected {
            border-color: #4ecdc4;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.5);
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .gallery-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 15px;
            color: white;
            font-size: 0.9rem;
        }

        .time-slider-container {
            margin: 30px 0;
        }

        .time-slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #ffecd2);
            outline: none;
            -webkit-appearance: none;
        }

        .time-slider::-webkit-slider-thumb {
            appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .time-display {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #4ecdc4;
            margin: 20px 0;
        }

        .predict-btn {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(45deg, #45b7d1, #96ceb4);
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .predict-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.3);
        }

        .predict-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        .result-item {
            text-align: center;
        }

        .result-item h3 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #4ecdc4;
        }

        .result-image {
            width: 100%;
            max-width: 400px;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .description {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-style: italic;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #4ecdc4;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #4ecdc4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .results {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useSyncExternalStore } = React;

        const room = new WebsimSocket();

        const timeRanges = [
            { value: 0, label: "0-7 Days", multiplier: 1, unit: "days" },
            { value: 1, label: "1-3 Weeks", multiplier: 2, unit: "weeks" },
            { value: 2, label: "1-12 Months", multiplier: 6, unit: "months" },
            { value: 3, label: "1-100 Years", multiplier: 50, unit: "years" },
            { value: 4, label: "1-10 Centuries", multiplier: 5, unit: "centuries" },
            { value: 5, label: "1-100 Millennia", multiplier: 50, unit: "millennia" }
        ];

        function FutureVision() {
            const [prompt, setPrompt] = useState('');
            const [selectedImage, setSelectedImage] = useState(null);
            const [timeValue, setTimeValue] = useState(2);
            const [generating, setGenerating] = useState(false);
            const [predicting, setPredicting] = useState(false);
            const [results, setResults] = useState(null);

            const baseImages = useSyncExternalStore(
                room.collection('base_image').subscribe,
                room.collection('base_image').getList
            );

            const generateBaseImage = async () => {
                if (!prompt.trim()) return;
                
                setGenerating(true);
                try {
                    const imageResult = await websim.imageGen({
                        prompt: prompt,
                        aspect_ratio: "1:1"
                    });

                    await room.collection('base_image').create({
                        prompt: prompt,
                        image_url: imageResult.url
                    });

                    setPrompt('');
                } catch (error) {
                    console.error('Error generating image:', error);
                } finally {
                    setGenerating(false);
                }
            };

            const predictFuture = async () => {
                if (!selectedImage) return;

                setPredicting(true);
                setResults(null);

                try {
                    // Step 1: Analyze the current image
                    const analysisCompletion = await websim.chat.completions.create({
                        messages: [
                            {
                                role: "user",
                                content: [
                                    {
                                        type: "text",
                                        text: `Analyze this image and provide a detailed description of what you see. Focus on the objects, environment, materials, conditions, and any notable features. Be specific and descriptive.`
                                    },
                                    {
                                        type: "image_url",
                                        image_url: { url: selectedImage.image_url }
                                    }
                                ]
                            }
                        ]
                    });

                    const currentDescription = analysisCompletion.content;

                    // Step 2: Project into the future
                    const timeRange = timeRanges[timeValue];
                    const timeDescription = `${timeRange.multiplier} ${timeRange.unit}`;

                    const futureCompletion = await websim.chat.completions.create({
                        messages: [
                            {
                                role: "system",
                                content: `You are an expert at predicting how things change over time due to natural processes, decay, growth, weather, aging, technological advancement, and other temporal factors.`
                            },
                            {
                                role: "user",
                                content: `Here is a description of something as it appears now: "${currentDescription}"

Now imagine how this would look after ${timeDescription} have passed. Consider all natural processes that would occur over this timeframe:
- Decay, rust, corrosion, weathering
- Plant growth, aging, seasonal changes
- Technological advancement or obsolescence
- Human impact and development
- Natural wear and tear
- Environmental changes

Provide a detailed description of how this scene would appear after ${timeDescription}, being realistic about the changes that would occur over this specific timeframe.`
                            }
                        ]
                    });

                    const futureDescription = futureCompletion.content;

                    // Step 3: Generate the future image
                    const futureImageResult = await websim.imageGen({
                        prompt: futureDescription,
                        aspect_ratio: "1:1"
                    });

                    // Step 4: Upload the future image to file storage
                    const response = await fetch(futureImageResult.url);
                    const blob = await response.blob();
                    const uploadedFutureUrl = await websim.upload(blob);

                    // Step 5: Save the future prediction as a base image
                    const futureRecord = await room.collection('base_image').create({
                        prompt: `Future: ${selectedImage.prompt} (after ${timeDescription})`,
                        image_url: uploadedFutureUrl,
                        is_future_prediction: true,
                        original_image_id: selectedImage.id,
                        time_range: timeDescription
                    });

                    setResults({
                        currentDescription,
                        futureDescription,
                        futureImageUrl: uploadedFutureUrl,
                        timeDescription
                    });

                } catch (error) {
                    console.error('Error predicting future:', error);
                    alert('Failed to predict future. Please try again.');
                } finally {
                    setPredicting(false);
                }
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1>Future Vision</h1>
                        <p>See how anything will look through the passage of time</p>
                    </div>

                    <div className="section">
                        <h2>🎨 Generate Base Image</h2>
                        <div className="generate-section">
                            <input
                                type="text"
                                className="prompt-input"
                                placeholder="Describe what you want to see (e.g., 'a beautiful garden', 'a modern building', 'an old car')"
                                value={prompt}
                                onChange={(e) => setPrompt(e.target.value)}
                                onKeyPress={(e) => e.key === 'Enter' && generateBaseImage()}
                            />
                            <button 
                                className="generate-btn"
                                onClick={generateBaseImage}
                                disabled={generating || !prompt.trim()}
                            >
                                {generating ? 'Generating...' : 'Generate & Add to Gallery'}
                            </button>
                        </div>
                    </div>

                    <div className="section">
                        <h2>🖼️ Select Base Image</h2>
                        <div className="gallery">
                            {baseImages.reverse().map(image => (
                                <div 
                                    key={image.id}
                                    className={`gallery-item ${selectedImage?.id === image.id ? 'selected' : ''}`}
                                    onClick={() => setSelectedImage(image)}
                                >
                                    <img src={image.image_url} alt={image.prompt} />
                                    <div className="overlay">
                                        <div>{image.prompt}</div>
                                        <small>by {image.username}</small>
                                    </div>
                                </div>
                            ))}
                        </div>
                        {baseImages.length === 0 && (
                            <p style={{textAlign: 'center', opacity: 0.7, marginTop: '20px'}}>
                                No base images yet. Generate one above!
                            </p>
                        )}
                    </div>

                    {selectedImage && (
                        <div className="section">
                            <h2>⏰ Time Travel</h2>
                            <div className="time-slider-container">
                                <input
                                    type="range"
                                    min="0"
                                    max="5"
                                    value={timeValue}
                                    onChange={(e) => setTimeValue(parseInt(e.target.value))}
                                    className="time-slider"
                                />
                                <div className="time-display">
                                    {timeRanges[timeValue].label}
                                </div>
                            </div>
                            <button 
                                className="predict-btn"
                                onClick={predictFuture}
                                disabled={predicting}
                            >
                                {predicting ? 'Traveling Through Time...' : 'See the Future'}
                            </button>
                        </div>
                    )}

                    {predicting && (
                        <div className="section">
                            <div className="loading">
                                <div className="spinner"></div>
                                Analyzing the present and calculating the future...
                            </div>
                        </div>
                    )}

                    {results && (
                        <div className="section">
                            <h2>🔮 Time Travel Results</h2>
                            <p style={{textAlign: 'center', marginBottom: '20px', fontSize: '1.1rem'}}>
                                After <strong>{results.timeDescription}</strong>
                            </p>
                            <div className="results">
                                <div className="result-item">
                                    <h3>Present</h3>
                                    <img src={selectedImage.image_url} alt="Present" className="result-image" />
                                    <div className="description">
                                        {results.currentDescription}
                                    </div>
                                </div>
                                <div className="result-item">
                                    <h3>Future</h3>
                                    <img src={results.futureImageUrl} alt="Future" className="result-image" />
                                    <div className="description">
                                        {results.futureDescription}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<FutureVision />, document.getElementById('root'));
    </script>

</body>
</html>
